# Organization defaults for this repository's sample recipes.
# Only the settings that differ from NAPT's built-in defaults are set here;
# run `napt init` elsewhere to see the full commented template.
apiVersion: napt/v1

psadt:
  # Brand pack replaces the default PSADT assets (logo/banner) with ours.
  brand_pack:
    path: brand-packs/napt
    mappings:
      - source: "AppIcon.*"
        target: "Assets/AppIcon"
      - source: "Banner.Classic.*"
        target: "Assets/Banner.Classic"

deployment:
  # Install entry: available to everyone in Company Portal.
  # "All Users" is Intune's built-in target, not an Entra ID group.
  install:
    intent: "available"
    groups: ["All Users"]

  # Update promotion rings (ring 0 -> 1 -> 2). Groups are Entra ID
  # display names, resolved to object IDs at apply time.
  rings:
    - name: "pilot"           # Ring 0
      groups: ["Pilot Devices"]
      promote_after_days: 2
    - name: "broad"           # Ring 1
      groups: ["Broad Devices"]
      promote_after_days: 5
    - name: "production"      # Ring 2 (terminal, never auto-advances)
      groups: ["Production Devices"]
